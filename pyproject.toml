[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm"
version = "0.1.0"
description = "Management Hub Manager (MHM)"
readme = "README.md"
authors = [{ name = "MHM Contributors" }]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.14.4",
  "certifi>=2026.10.19",
  "cryptography>=50.0.0",
  "discord.py>=2.3.0",
  "dnspython>=2.9.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "idna>=3.15",
  "msgpack>=1.2.3",
  "oauthlib>=4.0.0",
  "psutil>=5.9.0",
  "pyasn1>=0.6.4",
  "pydantic>=2.7.0",
  "PyNaCl>=1.6.2",
  "python-dotenv>=1.2.2",
  "pytz>=2023.3",
  "requests>=2.33.0",
  "schedule>=1.2.0",
  "tzlocal>=5.3.1",
  "urllib3>=2.8.0",
]

[project.optional-dependencies]
ui = [
  "PyOpenGL>=3.1.7",
  "PyOpenGL-accelerate>=3.1.7",
  "PySide6>=6.5.0",
]
dev = [
  "bandit[toml]>=1.7.0",
  "black>=26.10.1",
  "filelock>=4.2.1",
  "pylint>=4.0.9",
  "setuptools>=84.1.0",
  "pip-audit>=2.6.0",
  "py-spy>=0.4.1",
  "pyright>=1.1.380",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.14.0",
  "pytest-randomly>=3.15.0",
  "pytest-timeout>=2.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.1.0",
  "vulture>=2.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "checkins*", "communication*", "core*", "integrations*", "messages*", "notebook*", "resources*", "scheduler*", "storage*", "styles*", "tasks*", "ui*", "user*", "website*"]
exclude = ["archive*", "development_docs*", "development_tools*", "logs*", "scripts*", "tests*"]

[tool.setuptools.package-data]
"ui.generated" = ["*.py"]
resources = [
  "*.json",
  "default_checkin/*.json",
  "default_messages/*.json",
  "prompts/*.txt",
  "prompts/product_ai/*.txt",
]
styles = ["*.qss"]
website = ["*.css", "*.html", "*.js", "*.png", "fonts/*.txt", "fonts/*.woff2"]

# Pyright SSOT: whole-repo / IDE baseline (`pyright --project pyproject.toml`). Pylance discovers [tool.pyright] automatically.
# Former root and nested `development_tools/config/pyrightconfig.json` were removed; keep settings here only.
[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
reportReturnType = "none"
reportArgumentType = "warning"
reportOptionalMemberAccess = "warning"
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportUnboundVariable = "error"
reportUnsupportedDunderAll = "none"
ignore = []
exclude = [
  "scripts",
  "scripts/**",
  "ui/generated",
  "ui/generated/**",
  "**/__pycache__",
  "**/node_modules",
  "**/.pytest_cache",
  "**/.venv",
  "**/venv",
  "logs",
  "logs/**",
  "resources",
  "resources/**",
  "archive",
  "archive/**",
  "development_docs",
  "development_docs/**",
  "ai_development_docs",
  "ai_development_docs/**",
  "styles",
  "styles/**",
  "tests/logs",
  "tests/logs/**",
  "tests/data",
  "tests/data/**",
  "tests/temp",
  "tests/temp/**",
  "tests/fixtures",
  "tests/fixtures/**",
  ".git",
  ".pytest_cache",
  ".coverage",
  "*.pyc",
  "*.pyo",
]

# Bandit: loaded via `bandit -c pyproject.toml` (see development_tools/static_checks/analyze_bandit.py).
[tool.bandit]
exclude_dirs = [
  "tests",
  "development_tools/tests",
  "archive",
  "scripts/testing",
  "tests/fixtures",
  ".venv",
  "venv",
  "build",
  "dist",
  "node_modules",
  "__pycache__",
]
