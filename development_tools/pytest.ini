[pytest]
# Pytest config for development_tools tests. Invoke from the project root:
#   python -m pytest -c development_tools/pytest.ini --rootdir=. --confcutdir=tests/development_tools tests/development_tools/
# Runners (run_tests.py --mode development_tools, coverage, Tier 3) add those flags.

testpaths = tests/development_tools
confcutdir = tests/development_tools
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    behavior: Behavior tests for real system functionality
    ui: Tests for UI components
    slow: Slow-running tests (>1 second)
    fast: Fast-running tests (<100ms, optional)
    asyncio: Async tests requiring asyncio support
    no_parallel: Tests that must not run under pytest-xdist parallel execution
    e2e: End-to-end tests that run real audits with actual tool execution (slow, excluded from regular runs)
    development_tools: Domain marker for tests under tests/development_tools/
    file_io: Tests that use real filesystem I/O under tests/ (not pure mocks)
    suite: Meta marker for policy harness / test-infrastructure tests
    critical: Critical path tests that must always pass
    regression: Tests that catch regression issues
    smoke: Basic functionality smoke tests
    analytics: Analytics and reporting tests

addopts =
    -p no:cacheprovider
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --maxfail=10
    --durations=10
    --durations-min=0.1
    -o cache_dir=tests/data/tmp/pytest_cache
    --disable-warnings
    -m "not e2e"

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*development_tools.shared.operations is deprecated.*:DeprecationWarning
    ignore::UserWarning
    ignore:Duplicate name.*:UserWarning:zipfile
    ignore::FutureWarning
    ignore:.*There is no current event loop.*:DeprecationWarning
    ignore:__package__ != __spec__\.parent:DeprecationWarning:development_tools
    ignore:.*__package__ != __spec__\.parent.*:DeprecationWarning:development_tools
    ignore:.*__package__.*!=.*__spec__\.parent.*:DeprecationWarning:development_tools
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*I/O operation on closed file.*:ResourceWarning
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:.*cannot collect test class 'TestCoverageAnalyzer'.*:pytest.PytestCollectionWarning
    ignore:.*cannot collect test class 'TestCoverageReportGenerator'.*:pytest.PytestCollectionWarning
    ignore::pytest.PytestCollectionWarning:development_tools.tests

minversion = 6.0
timeout = 300
timeout_method = thread
cache_dir = tests/data/tmp/pytest_cache
